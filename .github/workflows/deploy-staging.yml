name: Deploy frontend staging

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://preview.hbs-home.com
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build and publish the exact validated release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_APP_ENVIRONMENT: staging
          VITE_HBS_API_BASE_URL: https://api-preview.hbs-home.com
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bun run deploy:staging
      - name: Verify the published release
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EXPECTED_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
          SMOKE_BASE_URL: https://preview.hbs-home.com
        run: bun run smoke:staging
